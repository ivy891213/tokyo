<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOKYO 16DN | 奕柔 & 楚軒 生日之旅</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans TC', sans-serif; }
    .page-view { display: none; }
    .page-view.active { display: block; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-[#EEF2F5] text-[#2C3E50] pb-28 max-w-md mx-auto min-h-screen relative select-none">

  <!-- Firebase 邏輯與功能 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC7kLqmUa2p_NavczyZernkGibbh6cDUk4",
      databaseURL: "https://tokyo20261128-20261213-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "tokyo20261128-20261213",
      storageBucket: "tokyo20261128-20261213.firebasestorage.app",
      messagingSenderId: "293845890979",
      appId: "1:293845890979:web:aba55dca6cbdd6226b4c16"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 頁面切換函式
    window.switchMainPage = function(pageId) {
        document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active'));
        document.getElementById(`page-${pageId}`).classList.add('active');
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.replace('text-[#2C4A5A]', 'text-slate-400'));
        document.getElementById(`nav-${pageId}`).classList.replace('text-slate-400', 'text-[#2C4A5A]');
    }

    // 新增記帳資料到 Firebase
    window.saveExpense = function() {
        const item = document.getElementById("expenseItem").value;
        const amount = document.getElementById("expenseAmount").value;
        const payer = document.getElementById("expensePayer").value;

        if (!item || !amount) {
            alert("請完整填寫項目與金額！");
            return;
        }

        push(ref(db, 'tokyo_expenses'), {
            item: item,
            amount: Number(amount),
            payer: payer,
            time: new Date().toLocaleString([], {month: '2-digit', day: '2-digit', hour: '2-digit', minute:'2-digit'})
        });

        // 清空輸入框
        document.getElementById("expenseItem").value = "";
        document.getElementById("expenseAmount").value = "";
    }

    // 即時監聽記帳資料並計算總金額與分帳
    onValue(ref(db, 'tokyo_expenses'), (snapshot) => {
        const list = document.getElementById("expense-list");
        const totalSpan = document.getElementById("total-amount");
        const yiruTotalSpan = document.getElementById("yiru-total");
        const chuxuanTotalSpan = document.getElementById("chuxuan-total");
        
        list.innerHTML = "";
        const data = snapshot.val();
        
        let grandTotal = 0;
        let yiruSum = 0;
        let chuxuanSum = 0;

        if (!data) {
            list.innerHTML = `<p class="text-center text-slate-400 text-xs py-6">目前還沒有記帳資料，趕快來記一筆吧！</p>`;
            totalSpan.innerText = "$0";
            yiruTotalSpan.innerText = "$0";
            chuxuanTotalSpan.innerText = "$0";
            return;
        }

        for (let key in data) {
            const exp = data[key];
            grandTotal += exp.amount;
            if (exp.payer === "奕柔") yiruSum += exp.amount;
            if (exp.payer === "楚軒") chuxuanSum += exp.amount;

            const payerBadgeColor = exp.payer === "奕柔" ? "bg-pink-100 text-pink-600" : "bg-blue-100 text-blue-600";

            list.innerHTML += `
                <div class="bg-white p-3 rounded-xl shadow-sm flex justify-between items-center text-xs">
                    <div>
                        <span class="px-2 py-0.5 rounded-full font-bold ${payerBadgeColor} mr-1">${exp.payer}</span>
                        <span class="font-bold text-slate-700">${exp.item}</span>
                        <div class="text-[10px] text-slate-400 mt-0.5">${exp.time}</div>
                    </div>
                    <div class="font-black text-sm text-slate-800">
                        $${exp.amount.toLocaleString()}
                    </div>
                </div>
            `;
        }

        totalSpan.innerText = `$${grandTotal.toLocaleString()}`;
        yiruTotalSpan.innerText = `$${yiruSum.toLocaleString()}`;
        chuxuanTotalSpan.innerText = `$${chuxuanSum.toLocaleString()}`;
    });
  </script>

  <!-- 頂部標題列 -->
  <header class="bg-white/90 backdrop-blur-md px-4 py-3 flex justify-between items-center border-b border-slate-100 sticky top-0 z-50 shadow-sm">
    <div class="flex items-center gap-2">
      <span class="w-2.5 h-2.5 rounded-full bg-[#2C4A5A]"></span>
      <span class="tracking-wider text-slate-800 font-bold text-xs">TOKYO 16DN</span>
    </div>
    <span class="text-xs font-bold text-amber-600 bg-amber-50 px-2.5 py-1 rounded-full border border-amber-200">
      <i class="fa-solid fa-cake-candles text-amber-500 mr-1"></i> 生日之旅
    </span>
  </header>

  <!-- 主要內容區 -->
  <main class="p-4 space-y-4">
    
    <!-- 1. 首頁 -->
    <div id="page-home" class="page-view active space-y-4">
      <section class="relative bg-[#2C4A5A] rounded-3xl overflow-hidden shadow-sm p-6 text-white text-center">
        <div class="absolute inset-0 bg-cover bg-center opacity-20" style="background-image: url('https://images.unsplash.com/photo-1503899036084-c55cdd92da26');"></div>
        <div class="relative z-10 space-y-2">
          <p class="text-[10px] tracking-[0.2em] text-amber-300 font-bold"><i class="fa-solid fa-cake-candles mr-1"></i> HAPPY BIRTHDAY TRIP</p>
          <h1 class="text-3xl font-black tracking-widest my-1">TOKYO</h1>
          <p class="text-xs font-bold tracking-wider opacity-90">2026.11.28 — 12.13</p>
          <p class="text-[10px] tracking-widest text-slate-300">奕柔 & 楚軒 的東京生日深度之旅</p>

          <div class="flex justify-center gap-2 pt-3">
            <button onclick="switchMainPage('timeline')" class="bg-[#008BB0] active:scale-95 text-white text-[11px] font-bold px-5 py-2 rounded-xl shadow-sm transition">
              <i class="fa-solid fa-play text-[9px] mr-1"></i> 開始行程
            </button>
            <button onclick="switchMainPage('expense')" class="bg-white/90 hover:bg-white active:scale-95 text-slate-700 text-[11px] font-bold px-4 py-2 rounded-xl shadow-sm transition">
              <i class="fa-solid fa-wallet text-[9px] mr-1 text-amber-600"></i> 即時記帳
            </button>
          </div>
        </div>
      </section>

      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
        <h3 class="text-xs font-bold text-slate-700 mb-2"><i class="fa-solid fa-circle-info text-[#2C4A5A] mr-1"></i> 歡迎使用生日之旅小幫手</h3>
        <p class="text-[11px] text-slate-500 leading-relaxed">點擊下方導覽列可以切換「行程」與「即時記帳」。所有記帳與花費都會自動同步到雲端，兩人手機隨時看得到最新總金額！</p>
      </div>
    </div>

    <!-- 2. 行程頁 (預留空間) -->
    <div id="page-timeline" class="page-view space-y-3">
      <h2 class="font-bold text-sm text-slate-700 px-1"><i class="fa-solid fa-calendar-days text-[#2C4A5A] mr-1"></i> Day 1 ~ Day 16 行程總覽</h2>
      <div class="bg-white p-5 rounded-2xl shadow-sm text-center text-slate-400 text-xs py-10">
        行程資料準備中，隨時可以把它們塞進來！
      </div>
    </div>

    <!-- 3. 即時記帳與分帳頁面 -->
    <div id="page-expense" class="page-view space-y-4">
      <h2 class="font-bold text-sm text-slate-700 px-1"><i class="fa-solid fa-wallet text-amber-600 mr-1"></i> 雙人即時共享記帳</h2>

      <!-- 總金額與統計卡片 -->
      <div class="grid grid-cols-3 gap-2 text-center">
        <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-100">
          <div class="text-[10px] text-slate-400 font-bold">總支出</div>
          <div id="total-amount" class="text-sm font-black text-slate-800 mt-1">$0</div>
        </div>
        <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-100">
          <div class="text-[10px] text-pink-500 font-bold">奕柔已付</div>
          <div id="yiru-total" class="text-sm font-black text-pink-600 mt-1">$0</div>
        </div>
        <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-100">
          <div class="text-[10px] text-blue-500 font-bold">楚軒已付</div>
          <div id="chuxuan-total" class="text-sm font-black text-blue-600 mt-1">$0</div>
        </div>
      </div>

      <!-- 新增記帳表單 -->
      <div class="bg-white p-4 rounded-2xl shadow-sm space-y-3 border border-slate-100">
        <div class="text-xs font-bold text-slate-700">新增一筆花費</div>
        <div class="grid grid-cols-2 gap-2">
          <input type="text" id="expenseItem" placeholder="消費項目 (例如: 一蘭拉麵)" class="w-full p-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-[#2C4A5A]">
          <input type="number" id="expenseAmount" placeholder="金額 (JPY/TWD)" class="w-full p-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-[#2C4A5A]">
        </div>
        <div class="flex gap-2">
          <select id="expensePayer" class="w-1/3 p-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none font-bold text-slate-700">
            <option value="奕柔">奕柔付</option>
            <option value="楚軒">楚軒付</option>
          </select>
          <button onclick="saveExpense()" class="w-2/3 bg-[#2C4A5A] hover:bg-[#1e333e] active:scale-95 text-white text-xs font-bold py-2.5 rounded-xl shadow-sm transition">
            <i class="fa-solid fa-plus mr-1"></i> 記一筆
          </button>
        </div>
      </div>

      <!-- 記帳明細列表 -->
      <div class="space-y-2">
        <div class="text-xs font-bold text-slate-700 px-1">消費明細記錄</div>
        <div id="expense-list" class="space-y-2">
          <!-- 這裡會由 Firebase 動態填入 -->
        </div>
      </div>
    </div>

  </main>

  <!-- 底部導覽列 -->
  <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white/95 backdrop-blur-md border-t border-slate-100 flex justify-around py-3 z-50 shadow-lg">
    <button onclick="switchMainPage('home')" id="nav-home" class="nav-btn flex flex-col items-center text-[#2C4A5A]">
      <i class="fa-solid fa-house text-base"></i>
      <span class="text-[9px] mt-0.5 font-bold">首頁</span>
    </button>
    <button onclick="switchMainPage('timeline')" id="nav-timeline" class="nav-btn flex flex-col items-center text-slate-400">
      <i class="fa-solid fa-calendar-days text-base"></i>
      <span class="text-[9px] mt-0.5 font-bold">行程</span>
    </button>
    <button onclick="switchMainPage('expense')" id="nav-expense" class="nav-btn flex flex-col items-center text-slate-400">
      <i class="fa-solid fa-wallet text-base"></i>
      <span class="text-[9px] mt-0.5 font-bold">記帳</span>
    </button>
  </nav>

</body>
</html>
