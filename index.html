<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOKYO 16DN | 奕柔 & 楚軒 生日之旅</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans TC', sans-serif; }
    .page-view { display: none; }
    .page-view.active { display: block; }
  </style>
</head>
<body class="bg-[#EEF2F5] text-[#2C3E50] pb-28 max-w-md mx-auto min-h-screen relative">

  <!-- Firebase 邏輯 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC7kLqmUa2p_NavczyZernkGibbh6cDUk4",
      databaseURL: "https://tokyo20261128-20261213-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "tokyo20261128-20261213",
      storageBucket: "tokyo20261128-20261213.firebasestorage.app",
      messagingSenderId: "293845890979",
      appId: "1:293845890979:web:aba55dca6cbdd6226b4c16"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 頁面切換函式
    window.switchMainPage = function(pageId) {
        document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active'));
        document.getElementById(`page-${pageId}`).classList.add('active');
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.replace('text-[#2C4A5A]', 'text-slate-400'));
        document.getElementById(`nav-${pageId}`).classList.replace('text-slate-400', 'text-[#2C4A5A]');
    }

    // Firebase 記帳存入與顯示
    window.saveData = function() {
        const input = document.getElementById("tripInput");
        if (!input.value) return;
        push(ref(db, 'tokyo_trips'), { content: input.value, time: new Date().toLocaleTimeString() });
        input.value = "";
    }

    onValue(ref(db, 'tokyo_trips'), (snapshot) => {
        const list = document.getElementById("record-list");
        list.innerHTML = "";
        const data = snapshot.val();
        for (let key in data) {
            list.innerHTML += `<div class="p-3 bg-white rounded-lg shadow-sm mb-2 text-sm">${data[key].content}</div>`;
        }
    });
  </script>

  <!-- 內容區 -->
  <main class="p-4">
    <!-- 首頁 -->
    <div id="page-home" class="page-view active">
        <h1 class="text-2xl font-black mt-10 text-center">TOKYO 16DN</h1>
        <p class="text-center text-sm mt-2 opacity-70">奕柔 & 楚軒 的生日之旅</p>
    </div>

    <!-- 行程頁 -->
    <div id="page-timeline" class="page-view">
        <h2 class="font-bold text-lg mb-4">行程總覽</h2>
        <div class="bg-white p-4 rounded-xl">Day 1 到 Day 16 的完整排程...</div>
    </div>

    <!-- 記帳頁 -->
    <div id="page-more" class="page-view">
        <h2 class="font-bold text-lg mb-4">即時共享記帳</h2>
        <input type="text" id="tripInput" class="w-full p-3 rounded-lg border" placeholder="輸入花費內容...">
        <button onclick="saveData()" class="w-full mt-2 bg-[#2C4A5A] text-white p-3 rounded-lg">送出</button>
        <div id="record-list" class="mt-4"></div>
    </div>
  </main>

  <!-- 底部導覽列 -->
  <nav class="fixed bottom-0 w-full max-w-md bg-white border-t flex justify-around py-4">
    <button onclick="switchMainPage('home')" id="nav-home" class="nav-btn text-[#2C4A5A]"><i class="fa-solid fa-house"></i></button>
    <button onclick="switchMainPage('timeline')" id="nav-timeline" class="nav-btn text-slate-400"><i class="fa-solid fa-calendar-days"></i></button>
    <button onclick="switchMainPage('more')" id="nav-more" class="nav-btn text-slate-400"><i class="fa-solid fa-file-invoice"></i></button>
  </nav>

</body>
</html>
