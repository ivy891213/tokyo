  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC7kLqmUa2p_NavczyZernkGibbh6cDUk4",
      authDomain: "tokyo20261128-20261213.firebaseapp.com",
      databaseURL: "https://tokyo20261128-20261213-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "tokyo20261128-20261213",
      storageBucket: "tokyo20261128-20261213.firebasestorage.app",
      messagingSenderId: "293845890979",
      appId: "1:293845890979:web:aba55dca6cbdd6226b4c16",
      measurementId: "G-SF0TB6LZHE"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.__firebaseMapDebug = {
      initialized: true,
      databaseURL: firebaseConfig.databaseURL
    };

    // 預設資料
    const defaultItinerary = [
      { day: 1, date: '11.28 SAT', title: '抵達東京 ➔ 晴空塔 ➔ 澀谷 SKY', items: [
        { time: '10:35', title: '抵達成田 T2 機場', desc: '京成成田電鐵 skyaccess：成田二航 - 押上 (53min)', cost: 1194 },
        { time: '11:30', title: '午餐 熙樂苑 KIRAKUEN WAGYU', cost: 0 },
        { time: '13:00', title: 'NOMAD COFFEE TOKYO', cost: 0 },
        { time: '13:30', title: '晴空塔逛逛', desc: '3F 6block ABC mart , 8block Uniqlo , 9block 泡泡馬特 , 10block 鬼塚虎,Martin , 11block LOFT <br> 4F 9block 似顏繪 , 10block 扭蛋店 , 11block JUMP', cost: 0 },
        { time: '16:00', title: 'Check in' , cost: 0 },
        { time: '17:30', title: '澀谷 SKY (Shibuya Sky)', desc: '地鐵：押上 - 澀谷 (30min)', cost: 220 }
      ]},
      { day: 2, date: '11.29 SUN', title: '自由探索行程', items: [] },
      { day: 3, date: '11.30 MON', title: '自由探索行程', items: [] },
      { day: 4, date: '12.01 TUE', title: '鎌倉一日遊 ➔ 七里濱拍富士山', items: [
        { time: '09:00', title: '搭乘江之電前往鎌倉/七里濱', desc: '江之電：鎌倉 - 七里濱 (15min / ¥260)', cost: 260 },
        { time: '12:00', title: '七里濱海岸 拍富士山秘境', desc: '推薦美食：Cafe Yoridocoro / Bills / Windera Cafe', cost: 0 }
      ]},
      { day: 5, date: '12.02 WED', title: '自由探索行程', items: [] },
      { day: 6, date: '12.03 THU', title: '自由探索行程', items: [] },
      { day: 7, date: '12.04 FRI', title: '山中湖富士山景觀之旅', items: [
        { time: '08:00', title: '高速巴士：新宿 ➔ 山中湖平野', desc: '車程 2h25m / 車資 ¥2,100', cost: 2100 },
        { time: '11:20', title: '長池親水公園 ➔ 午餐：THE PARK', desc: '', cost: 0 },
        { time: '13:00', title: '白鳥濱 ➔ 淺間神社 ➔ Lawson 打卡點', desc: '', cost: 0 }
      ]},
      { day: 8, date: '12.05 SAT', title: '自由探索行程', items: [] },
      { day: 9, date: '12.06 SUN', title: '自由探索行程', items: [] },
      { day: 10, date: '12.07 MON', title: '自由探索行程', items: [] },
      { day: 11, date: '12.08 TUE', title: '自由探索行程', items: [] },
      { day: 12, date: '12.09 WED', title: '東京迪士尼海洋 DisneySea', items: [
        { time: '08:00', title: '入園與搶 DPA 尊享卡', desc: '電車：市區 - 舞濱往返 (約 ¥800)', cost: 800 }
      ]},
      { day: 13, date: '12.10 THU', title: '自由探索行程', items: [] },
      { day: 14, date: '12.11 FRI', title: '自由探索行程', items: [] },
      { day: 15, date: '12.12 SAT', title: '自由探索行程 / 伴手禮最後採買', items: [] },
      { day: 16, date: '12.13 SUN', title: '成田機場 ➔ 返台', items: [
        { time: '09:25', title: '抵達咸田機場 T2', desc: '京成成田 skyaccess 回程 (¥1,194)', cost: 1194 },
        { time: '11:25', title: '✈️ 台灣虎航 IT201 起飛返台', desc: '', cost: 0 }
      ]}
    ];

    const defaultPrep = [
      { id: 1, text: '護照正本 (確認6個月以上效期)', checked: false },
      { id: 2, text: 'Visit Japan Web 入境填寫', checked: false },
      { id: 3, text: '日幣現金 / 信用卡 / 保險單', checked: false }
    ];

    const defaultTicket = [
      { id: 10, text: '澀谷 SKY 展望台門票 (10/31 23:00開放)', checked: false },
      { id: 11, text: '東京迪士尼海洋門票 / DPA準備', checked: false }
    ];

    // 全域資料變數
    window.itineraryData = [];
    window.prepList = [];
    window.ticketList = [];
    window.expenses = [];
    window.mapPlaces = [];

    let isCloudLoaded = false;
    let isMapCloudLoaded = false;

    const tripRef = ref(db, 'tokyo_trip_data');
    const mapPlacesRef = ref(db, 'tokyo_trip_data/mapPlaces');

    // ★ 修正：將 showCloudStatus 掛載至 window 全域
    window.showCloudStatus = function(message, ok = true) {
      let el = document.getElementById('cloud-sync-status');
      if (!el) {
        el = document.createElement('div');
        el.id = 'cloud-sync-status';
        el.style.cssText = 'position:fixed;left:50%;bottom:82px;transform:translateX(-50%);z-index:9999;padding:7px 12px;border-radius:999px;font-size:11px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.12);pointer-events:none;background:' + (ok ? '#ECFDF5' : '#FEF2F2') + ';color:' + (ok ? '#047857' : '#B91C1C') + ';';
        document.body.appendChild(el);
      }
      el.textContent = message;
      el.style.background = ok ? '#ECFDF5' : '#FEF2F2';
      el.style.color = ok ? '#047857' : '#B91C1C';
      clearTimeout(window.__cloudStatusTimer);
      window.__cloudStatusTimer = setTimeout(() => el.remove(), 2200);
    };

    // 監聽主要行程/清單資料
    onValue(tripRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        window.itineraryData = data.itinerary || defaultItinerary;
        window.prepList = data.prep || defaultPrep;
        window.ticketList = data.ticket || defaultTicket;
        window.expenses = data.expenses || [];
      } else if (!isCloudLoaded) {
        window.itineraryData = defaultItinerary;
        window.prepList = defaultPrep;
        window.ticketList = defaultTicket;
        window.expenses = [];
      }

      isCloudLoaded = true;

      if (typeof renderTimeline === 'function') {
        renderTimeline();
        renderPrepList();
        renderTicketList();
        updateAllProgressUI();
        calculateTransportExpenses();
        updateBudgetUI();
      }
    }, (error) => {
      console.error("主要資料讀取失敗:", error);
      window.showCloudStatus("雲端讀取失敗，請檢查 Firebase Rules", false);
    });

    // 監聽地圖自訂地點
    onValue(mapPlacesRef, (snapshot) => {
      const data = snapshot.val();

      if (!data || typeof data !== 'object') {
        window.mapPlaces = [];
      } else {
        window.mapPlaces = Object.entries(data)
          .map(([key, value]) => value ? ({ ...value, id: value.id || key }) : null)
          .filter(Boolean)
          .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
      }

      isMapCloudLoaded = true;

      if (typeof renderCustomMapPlaces === 'function') {
        renderCustomMapPlaces();
      }
    }, (error) => {
      console.error("地圖地點讀取失敗:", error);
      isMapCloudLoaded = false;
      window.showCloudStatus("地圖同步失敗：請檢查 Firebase Rules", false);
    });

    // 儲存主要資料
    window.saveToFirebase = function() {
      if (!isCloudLoaded) {
        window.showCloudStatus("雲端尚未載入完成", false);
        return Promise.reject(new Error("Cloud data not loaded"));
      }

      return set(tripRef, {
        itinerary: window.itineraryData,
        prep: window.prepList,
        ticket: window.ticketList,
        expenses: window.expenses
      }).then(() => {
        window.showCloudStatus("已同步到雲端");
      }).catch((error) => {
        console.error("寫入雲端失敗:", error);
        window.showCloudStatus("寫入失敗：請檢查 Firebase Rules", false);
        throw error;
      });
    };

    // 新增單一地圖地點
    window.saveOneMapPlaceToFirebase = async function(place) {
      if (!db) throw new Error("Firebase Database 尚未初始化");
      const placeRef = ref(db, 'tokyo_trip_data/mapPlaces/' + place.id);

      try {
        await set(placeRef, {
          id: place.id,
          name: place.name,
          link: place.link,
          type: place.type,
          area: place.area,
          createdAt: place.createdAt
        });
        window.showCloudStatus("地點已成功存到雲端");
        return true;
      } catch (error) {
        console.error("地圖地點寫入失敗:", error);
        window.showCloudStatus("儲存失敗：" + (error?.message || "Firebase Rules"), false);
        throw error;
      }
    };
  </script>

  <style>
    body { font-family: 'Noto Sans TC', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body data-build="firebase-map-sync-v6-syntax-fix" class="bg-[#EEF2F5] text-[#2C3E50] pb-28 max-w-md mx-auto min-h-screen relative font-sans select-none">

  <header class="bg-white/90 backdrop-blur-md px-4 py-3 flex justify-between items-center border-b border-slate-100 sticky top-0 z-50 shadow-sm">
    <div class="flex items-center gap-2">
      <span class="w-2.5 h-2.5 rounded-full bg-[#2C4A5A]"></span>
      <span class="tracking-wider text-slate-800 font-bold text-xs">TOKYO 16DN <span class="text-[9px] text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded ml-1"><i class="fa-solid fa-cloud"></i> 雲端即時同步</span></span>
    </div>
    <span class="text-xs font-bold text-amber-600 bg-amber-50 px-2.5 py-1 rounded-full border border-amber-200">
      <i class="fa-solid fa-cake-candles text-amber-500 mr-1"></i> 生日之旅
    </span>
  </header>

  <main class="p-4 space-y-4">
    <!-- 你的頁面內容保持不變 -->
  </main>

</body>
</html>
