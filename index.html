<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOKYO 16DN | 奕柔 & 楚軒 生日之旅</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans TC', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#EEF2F5] text-[#2C3E50] pb-28 max-w-md mx-auto min-h-screen relative font-sans select-none">

  <!-- Firebase 引入與邏輯 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // 您的專案設定
    const firebaseConfig = {
      apiKey: "AIzaSyC7kLqmUa2p_NavczyZernkGibbh6cDUk4",
      authDomain: "tokyo20261128-20261213.firebaseapp.com",
      databaseURL: "https://tokyo20261128-20261213-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "tokyo20261128-20261213",
      storageBucket: "tokyo20261128-20261213.firebasestorage.app",
      messagingSenderId: "293845890979",
      appId: "1:293845890979:web:aba55dca6cbdd6226b4c16",
      measurementId: "G-SF0TB6LZHE"
    };

    // 初始化
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 綁定全域函式讓按鈕呼叫
    window.saveData = function() {
        const text = document.getElementById("tripInput").value;
        if (!text) {
            alert("請先輸入內容！");
            return;
        }

        // 推送資料到 Realtime Database 的 tokyo_trips 資料夾
        const tripsRef = ref(db, 'tokyo_trips');
        push(tripsRef, {
            content: text,
            time: new Date().toLocaleString()
        }).then(() => {
            alert("成功寫入 Firebase 雲端！");
            document.getElementById("tripInput").value = ""; // 清空輸入框
        }).catch((error) => {
            alert("寫入失敗：" + error.message);
        });
    }
  </script>

  <header class="bg-white/90 backdrop-blur-md px-4 py-3 flex justify-between items-center border-b border-slate-100 sticky top-0 z-50 shadow-sm">
    <div class="flex items-center gap-2">
      <span class="w-2.5 h-2.5 rounded-full bg-[#2C4A5A]"></span>
      <span class="tracking-wider text-slate-800 font-bold text-xs">TOKYO 16DN</span>
    </div>
    <span class="text-xs font-bold text-amber-600 bg-amber-50 px-2.5 py-1 rounded-full border border-amber-200">
      <i class="fa-solid fa-cake-candles text-amber-500 mr-1"></i> 生日之旅
    </span>
  </header>

  <main class="p-4 space-y-4">

    <!-- Firebase 讀寫測試區塊 (移至 body 內) -->
    <div style="background: #f0f0f0; padding: 20px; border-radius: 8px;">
        <h3 class="text-xs font-bold mb-2">東京行程雲端同步測試</h3>
        <input type="text" id="tripInput" placeholder="請輸入行程或花費..." style="width: 70%; padding: 5px; font-size: 12px;">
        <button onclick="saveData()" style="padding: 5px 10px; background: #007bff; color: white; border: none; cursor: pointer; font-size: 12px;">存入雲端</button>
    </div>

    <div id="page-home" class="page-view space-y-4">
      
      <section class="relative bg-[#2C4A5A] rounded-3xl overflow-hidden shadow-sm p-6 text-white text-center">
        <div class="absolute inset-0 bg-cover bg-center opacity-30" style="background-image: url('https://images.unsplash.com/photo-1503899036084-c55cdd92da26');"></div>
        <div class="relative z-10 space-y-1">
          <p class="text-[10px] tracking-[0.2em] text-amber-300 font-bold"><i class="fa-solid fa-cake-candles mr-1"></i> HAPPY BIRTHDAY TRIP</p>
          <h1 class="text-3xl font-black tracking-widest my-1">TOKYO</h1>
          <p class="text-xs font-bold tracking-wider opacity-90">2026.11.28 — 12.13</p>
          <p class="text-[9px] tracking-widest text-slate-300 pt-1">奕柔 & 楚軒 的東京生日深度之旅</p>

          <div class="flex justify-center gap-2 pt-4">
            <button onclick="switchMainPage('timeline')" class="bg-[#008BB0] active:scale-95 text-white text-[11px] font-bold px-5 py-2 rounded-xl flex items-center gap-1.5 shadow-sm transition">
              <i class="fa-solid fa-play text-[9px]"></i> 開始行程
            </button>
            <button onclick="switchMainPage('map')" class="bg-white/90 hover:bg-white active:scale-95 text-slate-700 text-[11px] font-bold px-4 py-2 rounded-xl flex items-center gap-1.5 shadow-sm transition">
              <i class="fa-solid fa-map-location-dot text-[9px]"></i> 地圖景點超連結
            </button>
          </div>
        </div>
      </section>

      <!-- 其他原本的區塊保持不變 -->
    </div>

  </main>

  <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white/95 backdrop-blur-md border-t border-slate-100 flex justify-around py-3 z-50 shadow-lg">
    <button onclick="switchMainPage('home')" id="nav-btn-home" class="main-nav-btn flex flex-col items-center text-[#2C4A5A]">
      <i class="fa-solid fa-house text-base"></i>
      <span class="text-[9px] mt-0.5 font-bold">首頁</span>
    </button>
    <button onclick="switchMainPage('timeline')" id="nav-btn-timeline" class="main-nav-btn flex flex-col items-center text-slate-400">
      <i class="fa-solid fa-calendar-days text-base"></i>
      <span class="text-[9px] mt-0.5 font-bold">行程</span>
    </button>
    <button onclick="switchMainPage('map')" id="nav-btn-map" class="main-nav-btn flex flex-col items-center text-slate-400">
      <i class="fa-solid fa-map-location-dot text-base"></i>
      <span class="text-[9px] mt-0.5 font-bold">地圖</span>
    </button>
    <button onclick="switchMainPage('more')" id="nav-btn-more" class="main-nav-btn flex flex-col items-center text-slate-400">
      <i class="fa-solid fa-ellipsis text-base"></i>
      <span class="text-[9px] mt-0.5 font-bold">更多</span>
    </button>
  </nav>

</body>
</html>
